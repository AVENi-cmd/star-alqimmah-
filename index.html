<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ستار القمة للشقق المخدومة | TOP STAR Serviced Apartments</title>
  
  <!-- خطوط عربية ولاتينية فندقية راقية -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&family=Cinzel:wght@600;700;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #080B10;
      --bg-surface: #0F141F;
      --bg-card: #141B2A;
      --bg-card-hover: #1A2337;
      
      --brand-red: #D92525;
      --brand-red-glow: rgba(217, 37, 37, 0.35);
      
      --gold-accent: #C8A265;
      --gold-light: #E0C392;
      
      --text-white: #F8FAFC;
      --text-muted: #94A3B8;
      --text-dim: #64748B;
      
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-gold: rgba(200, 162, 101, 0.25);
      
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Cairo', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-white);
      line-height: 1.6;
      overflow-x: hidden;
    }

    /* شريط الاستقبال العلوي */
    .hotel-topbar {
      background: #05070A;
      border-bottom: 1px solid var(--border-subtle);
      padding: 9px 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      color: var(--text-muted);
    }
    .topbar-info { display: flex; align-items: center; gap: 16px; }
    .topbar-badge {
      background: rgba(200, 162, 101, 0.12);
      color: var(--gold-light);
      padding: 3px 10px;
      border-radius: 4px;
      border: 1px solid var(--border-gold);
      font-size: 11.5px;
      font-weight: 600;
    }
    .topbar-phone {
      color: #FFF;
      text-decoration: none;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: color 0.2s;
    }
    .topbar-phone:hover { color: var(--gold-light); }

    /* الهيدر الفندقي */
    header {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(8, 11, 16, 0.92);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border-subtle);
      padding: 16px 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* الشعار المطابق للوحة الفندق */
    .hotel-identity {
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .logo-emblem {
      width: 44px;
      height: 44px;
      background: linear-gradient(135deg, #1C2436 0%, #0D121D 100%);
      border: 1px solid var(--border-gold);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    .logo-emblem .star-icon {
      color: var(--brand-red);
      font-size: 20px;
      filter: drop-shadow(0 0 8px var(--brand-red-glow));
    }
    .brand-titles { display: flex; flex-direction: column; }
    .brand-ar-main {
      font-size: 22px;
      font-weight: 900;
      color: #FFFFFF;
      line-height: 1.15;
    }
    .brand-ar-sub {
      font-size: 11px;
      font-weight: 600;
      color: var(--gold-light);
      letter-spacing: 0.5px;
    }
    .brand-en-tag {
      font-family: 'Cinzel', serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      color: #CBD5E1;
      display: flex;
      gap: 5px;
      margin-top: 1px;
    }
    .brand-en-tag .red-star {
      color: var(--brand-red);
      font-weight: 900;
      text-shadow: 0 0 10px var(--brand-red-glow);
    }

    .btn-nav-book {
      background: linear-gradient(135deg, var(--brand-red) 0%, #B91C1C 100%);
      color: #FFF;
      text-decoration: none;
      padding: 10px 22px;
      border-radius: 8px;
      font-size: 13.5px;
      font-weight: 800;
      box-shadow: 0 4px 16px var(--brand-red-glow);
      transition: all 0.25s ease;
      display: flex;
      align-items: center;
      gap: 8px;
      border: none;
      cursor: pointer;
    }
    .btn-nav-book:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(217, 37, 37, 0.5);
    }

    /* الهيرو الفندقي الفاخر */
    .hero-section {
      position: relative;
      min-height: 80vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 70px 20px 100px;
      background: radial-gradient(circle at 50% 30%, #172136 0%, #080B10 80%);
    }
    .hero-content {
      position: relative;
      z-index: 2;
      max-width: 860px;
      margin: 0 auto;
    }
    
    .hero-hospitality-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(200, 162, 101, 0.1);
      border: 1px solid var(--border-gold);
      color: var(--gold-light);
      padding: 6px 18px;
      border-radius: 30px;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 22px;
    }
    
    .hero-hotel-name {
      font-size: clamp(34px, 5.5vw, 56px);
      font-weight: 900;
      color: #FFFFFF;
      line-height: 1.2;
      margin-bottom: 8px;
    }
    .hero-en-sub {
      font-family: 'Cinzel', serif;
      font-size: clamp(14px, 2.2vw, 19px);
      letter-spacing: 5px;
      color: #CBD5E1;
      margin-bottom: 22px;
      font-weight: 700;
    }
    .hero-en-sub span {
      color: var(--brand-red);
      font-weight: 900;
    }
    .hero-desc {
      color: var(--text-muted);
      font-size: clamp(15px, 2vw, 17.5px);
      line-height: 1.8;
      max-width: 680px;
      margin: 0 auto 35px;
    }

    /* شريط الكونسيرج الفندقي (Concierge Bar) */
    .concierge-bar-wrap {
      max-width: 980px;
      margin: -50px auto 70px;
      padding: 0 16px;
      position: relative;
      z-index: 20;
    }
    .concierge-bar {
      background: rgba(20, 27, 42, 0.95);
      border: 1px solid var(--border-gold);
      border-radius: var(--radius-md);
      padding: 20px 24px;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(20px);
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)) 160px;
      gap: 16px;
      align-items: end;
    }
    .c-field label {
      display: block;
      font-size: 11.5px;
      font-weight: 700;
      color: var(--gold-light);
      margin-bottom: 7px;
    }
    .c-field select, .c-field input {
      width: 100%;
      background: #0B0E14;
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      color: #FFF;
      padding: 12px 14px;
      font-size: 13.5px;
      outline: none;
      transition: border-color 0.2s;
    }
    .c-field select:focus, .c-field input:focus {
      border-color: var(--gold-accent);
    }
    .btn-concierge-submit {
      background: linear-gradient(135deg, var(--gold-accent) 0%, #9B783E 100%);
      color: #080B10;
      border: none;
      border-radius: var(--radius-sm);
      padding: 13px 18px;
      font-weight: 900;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      height: 47px;
      transition: all 0.2s;
    }
    .btn-concierge-submit:hover {
      background: linear-gradient(135deg, #DEBE88 0%, #B38E4D 100%);
      transform: translateY(-2px);
    }

    .container {
      max-width: 1180px;
      margin: 0 auto;
      padding: 0 20px;
    }

    /* عناوين الأقسام */
    .section-header {
      text-align: center;
      margin-bottom: 50px;
    }
    .section-eyebrow {
      color: var(--gold-light);
      font-size: 12.5px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 8px;
      display: block;
    }
    .section-title {
      font-size: clamp(26px, 3.8vw, 36px);
      font-weight: 900;
      color: #FFF;
      margin-bottom: 12px;
    }
    .section-subtitle {
      color: var(--text-muted);
      font-size: 15px;
      max-width: 580px;
      margin: 0 auto;
    }

    /* ركائز تجربة الإقامة */
    .pillars-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 24px;
      margin-bottom: 90px;
    }
    .pillar-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 30px 24px;
      transition: all 0.3s ease;
    }
    .pillar-card:hover {
      transform: translateY(-5px);
      border-color: var(--border-gold);
      background: var(--bg-card);
    }
    .pillar-icon {
      width: 52px;
      height: 52px;
      background: rgba(200, 162, 101, 0.1);
      border: 1px solid var(--border-gold);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      margin-bottom: 20px;
      color: var(--gold-light);
    }
    .pillar-title {
      font-size: 18px;
      font-weight: 800;
      color: #FFF;
      margin-bottom: 10px;
    }
    .pillar-desc {
      font-size: 13.5px;
      color: var(--text-muted);
      line-height: 1.7;
    }

    /* تشكيلة الأجنحة والشقق الفندقية */
    .suites-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(330px, 1fr));
      gap: 30px;
      margin-bottom: 90px;
    }
    .suite-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: all 0.3s ease;
    }
    .suite-card:hover {
      transform: translateY(-6px);
      border-color: rgba(217, 37, 37, 0.4);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
    }
    .suite-visual {
      height: 220px;
      background: linear-gradient(135deg, #1A2337 0%, #0D121D 100%);
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-bottom: 1px solid var(--border-subtle);
    }
    .suite-visual-badge {
      position: absolute;
      top: 16px;
      right: 16px;
      background: rgba(8, 11, 16, 0.85);
      border: 1px solid var(--border-gold);
      color: var(--gold-light);
      font-size: 11px;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 20px;
    }
    .suite-symbol {
      font-size: 44px;
      margin-bottom: 8px;
      color: var(--gold-light);
    }
    .suite-type-en {
      font-family: 'Cinzel', serif;
      font-size: 11.5px;
      letter-spacing: 2px;
      color: var(--text-muted);
    }

    .suite-details {
      padding: 24px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }
    .suite-name {
      font-size: 20px;
      font-weight: 800;
      color: #FFF;
      margin-bottom: 8px;
    }
    .suite-tagline {
      font-size: 13px;
      color: var(--gold-light);
      margin-bottom: 18px;
    }
    
    .suite-amenities-list {
      list-style: none;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 24px;
      font-size: 12.5px;
      color: #CBD5E1;
    }
    .suite-amenities-list li {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .suite-amenities-list li::before {
      content: '✓';
      color: var(--brand-red);
      font-weight: 900;
    }

    .suite-footer {
      border-top: 1px solid var(--border-subtle);
      padding-top: 18px;
      margin-top: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .suite-rate {
      display: flex;
      flex-direction: column;
    }
    .suite-rate-num {
      font-size: 24px;
      font-weight: 900;
      color: #FFF;
      line-height: 1;
    }
    .suite-rate-unit {
      font-size: 11.5px;
      color: var(--text-muted);
      margin-top: 4px;
    }
    .btn-reserve-suite {
      background: #1E283D;
      color: #FFF;
      border: 1px solid var(--border-gold);
      padding: 10px 18px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.25s;
    }
    .btn-reserve-suite:hover {
      background: var(--brand-red);
      border-color: var(--brand-red);
      box-shadow: 0 4px 15px var(--brand-red-glow);
    }

    /* مرافق الفندق */
    .hotel-features-section {
      background: #0B0F17;
      border-top: 1px solid var(--border-subtle);
      border-bottom: 1px solid var(--border-subtle);
      padding: 70px 0;
      margin-bottom: 90px;
    }
    .features-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      text-align: center;
    }
    .feature-item {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 24px 16px;
    }
    .feature-emoji { font-size: 30px; margin-bottom: 12px; }
    .feature-name { font-size: 15px; font-weight: 800; color: #FFF; margin-bottom: 4px; }
    .feature-desc { font-size: 12px; color: var(--text-muted); }

    /* الموقع الجغرافي */
    .location-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 35px 30px;
      margin-bottom: 90px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
      align-items: center;
    }
    @media(max-width: 800px) { .location-card { grid-template-columns: 1fr; } }
    .loc-title { font-size: 24px; font-weight: 900; color: #FFF; margin-bottom: 12px; }
    .loc-desc { font-size: 14px; color: var(--text-muted); line-height: 1.8; margin-bottom: 20px; }
    .distance-tags { display: flex; flex-direction: column; gap: 10px; }
    .dist-row { display: flex; justify-content: space-between; font-size: 13px; border-bottom: 1px solid var(--border-subtle); padding-bottom: 8px; }
    .dist-row span:last-child { color: var(--gold-light); font-weight: 700; }
    .btn-maps {
